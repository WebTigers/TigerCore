name: Publish release on tag

# A pushed v<semver> tag MUST become a published GitHub Release — that is what fires the vendored-ZIP
# build (release-zip.yml, on release:published), and the vendored ZIP is the artifact the no-shell
# updater (Tiger_Update_Core) downloads + atomically swaps into vendor/. Tags used to be pushed bare
# (git tag + git push): they reached Packagist for Composer users, but published NO Release and NO
# vendored ZIP — silently disabling one-click "Update core" on every shared-host install (1.9.0–1.12.0
# all shipped with no updater artifact this way). This closes the gap: every v-tag publishes a Release.
#
# Idempotent — re-running, or a hand-created release, is a no-op. Release notes come from the matching
# CHANGELOG.md section when present, else GitHub's auto-generated notes.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the GitHub Release (idempotent; notes from CHANGELOG)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists — nothing to do"
            exit 0
          fi
          VER="${TAG#v}"
          NOTES="$(awk -v v="$VER" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/{f=0} f' CHANGELOG.md)"
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > /tmp/release-notes.md
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
          echo "✓ published release $TAG (release-zip.yml now builds + attaches the vendored ZIP)"
