name: Capabilities index

# CAPABILITIES.md is generated from class docblocks (bin/build-capabilities.php) and COMMITTED so agents
# can grep it. That only stays trustworthy if it can't drift: regenerate here and fail the PR if the
# committed file differs — i.e. a changed/added class docblock must be reflected in the index.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: capabilities-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
      - name: CAPABILITIES.md is current
        run: php bin/build-capabilities.php --check
