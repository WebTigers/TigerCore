name: Claude AI Review

# Automated AI code review on every PR — security, correctness, and code smell, well beyond the
# functional smoke/test suite. Advisory by design: the review posts as a comment/check and NEVER
# blocks a merge (the human + the required smoke/tests/coverage/version checks stay the gate).
#
# REQUIRES two one-time, owner-only steps (a workflow file alone does nothing):
#   1. Install the Claude GitHub App on this repo:  https://github.com/apps/claude
#   2. Add the repo secret CLAUDE_CODE_OAUTH_TOKEN — generate it with `claude setup-token` (bills the
#      Claude subscription, not API credits), then set it under Settings → Secrets and variables → Actions.
# `claude /install-github-app` can walk both. Review calibration (what counts as Important vs a Nit for
# this codebase) lives in the repo-root REVIEW.md.

on:
  pull_request:
    # Reviews on open + on each push while the PR is open. Drop `synchronize` to go back to once-per-PR
    # (open/reopen only) if you'd rather keep token spend to a single review per PR.
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts until they're marked ready (saves tokens on WIP branches).
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The real runaway guard. Typical reviews finish in 1-3 min; the longest that has ever completed
    # was 11m15s. 30 caps the bill without truncating a legitimately deep review.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write   # required: the action fetches an OIDC token to authenticate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the reviewer can diff against the base

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Calibration lives in the repo-root REVIEW.md (highest-priority instruction to every agent).
          # Sonnet 5 is the cost/quality default (~half of Opus). For a deep security pass, switch the
          # model to claude-opus-4-8.
          #
          # --max-turns: the cap binds on TOOL CALLS, not wall-clock — a PR touching many files spends
          # turns on reads. At 30 it was exhausting on exactly the large security PRs where review is
          # worth most (#227 hit the cap in 5 min; #226, a bigger review, finished inside it in 11 min),
          # and an exhausted run posts NOTHING — a red check with no findings, which reads as "reviewed,
          # nothing found". 100 gives ~3x headroom over the worst run that has completed. Cost is bounded
          # by timeout-minutes below, which is the honest backstop: it caps a runaway by wall-clock no
          # matter how cheap the individual turns are.
          claude_args: "--max-turns 100 --model claude-sonnet-5"
