;  update (composer update / Module Manager) -- any edit here is SILENTLY LOST.
;  Customize by OVERRIDING in an APP-OWNED tier (merges on top, later wins, and
;  survives updates): application/configs/application.ini * local.ini (secrets) *
;  the `config` DB table (runtime, no deploy).  ACL rules: your OWN module's
;  acl.ini or the acl_* DB tables.  See ARCHITECTURE.md Sec 0 + Sec 5 (cascade).
; ==============================================================================

; Backup module ACL — TIGER-OWNED (first-party). Deny-by-default.
;
; A backup archive holds EVERY org's data (and, optionally, the install's secrets), so the acts that let
; a person READ an archive's contents or REPLACE the install with one are superadmin (TIGER-511):
;   admin      — the screen, run a backup (without secrets), delete one, save the schedule settings;
;   superadmin — download an archive, restore (from history or an upload), include secrets.
; An admin who could download could read every tenant's rows and every secret; one who could restore
; could overwrite the install (user + acl tables included) with an archive of their choosing.
[production]

acl.resources.backup_index_ctrl.resource = "Backup_IndexController"
acl.resources.backup_svc.resource        = "Backup_Service_Backup"
; The capability over a backup's CONTENTS — privileges `download`, `restore`, `include_secrets`. Checked
; in-method by Backup_IndexController (download/upload) and Backup_Service_Backup (run/saveSettings
; secrets) and read by the screen to hide what the role can't do.
acl.resources.backup_data.resource       = "Tiger_Backup_Data"

; --- the screen (controller). Kept a resource-level admin grant so the sidebar item (which asks the ACL
; about the resource as a whole) still shows; the two stream actions additionally require the
; Tiger_Backup_Data capability below, checked inside the action.
acl.rules.backup_index_ctrl.role       = "admin"
acl.rules.backup_index_ctrl.resource   = "Backup_IndexController"
acl.rules.backup_index_ctrl.permission = "allow"

; --- /api service: one rule per privilege (= method) ------------------------------------------------
acl.rules.backup_svc_run.role       = "admin"
acl.rules.backup_svc_run.resource   = "Backup_Service_Backup"
acl.rules.backup_svc_run.privilege  = "run"
acl.rules.backup_svc_run.permission = "allow"

acl.rules.backup_svc_remove.role       = "admin"
acl.rules.backup_svc_remove.resource   = "Backup_Service_Backup"
acl.rules.backup_svc_remove.privilege  = "remove"
acl.rules.backup_svc_remove.permission = "allow"

acl.rules.backup_svc_settings.role       = "admin"
acl.rules.backup_svc_settings.resource   = "Backup_Service_Backup"
acl.rules.backup_svc_settings.privilege  = "saveSettings"
acl.rules.backup_svc_settings.permission = "allow"

acl.rules.backup_svc_restore.role       = "superadmin"
acl.rules.backup_svc_restore.resource   = "Backup_Service_Backup"
acl.rules.backup_svc_restore.privilege  = "restore"
acl.rules.backup_svc_restore.permission = "allow"

; --- the contents capability: one rule per privilege -----------------------------------------------
acl.rules.backup_data_download.role       = "superadmin"
acl.rules.backup_data_download.resource   = "Tiger_Backup_Data"
acl.rules.backup_data_download.privilege  = "download"
acl.rules.backup_data_download.permission = "allow"

acl.rules.backup_data_restore.role       = "superadmin"
acl.rules.backup_data_restore.resource   = "Tiger_Backup_Data"
acl.rules.backup_data_restore.privilege  = "restore"
acl.rules.backup_data_restore.permission = "allow"

acl.rules.backup_data_secrets.role       = "superadmin"
acl.rules.backup_data_secrets.resource   = "Tiger_Backup_Data"
acl.rules.backup_data_secrets.privilege  = "include_secrets"
acl.rules.backup_data_secrets.permission = "allow"

[staging : production]

[testing : production]

[development : production]
