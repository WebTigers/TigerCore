;
; Public front-end routes under /newsletter (ingested by Tiger_Routing_ModuleRoutes — declarative, no
; Bootstrap code). These are the landing pages the double-opt-in emails link to. The subscriber admin
; screen (/newsletter/admin) needs no route — it resolves by default module/controller/action routing.
[production]
resources.router.routes.newsletterConfirm.route              = "newsletter/confirm/token/:token"
resources.router.routes.newsletterConfirm.defaults.module     = "newsletter"
resources.router.routes.newsletterConfirm.defaults.controller = "index"
resources.router.routes.newsletterConfirm.defaults.action     = "confirm"

resources.router.routes.newsletterUnsubscribe.route              = "newsletter/unsubscribe/token/:token"
resources.router.routes.newsletterUnsubscribe.defaults.module     = "newsletter"
resources.router.routes.newsletterUnsubscribe.defaults.controller = "index"
resources.router.routes.newsletterUnsubscribe.defaults.action     = "unsubscribe"

[staging : production]
[testing : production]
[development : production]
