; ==============================================================================
;  TIGER-OWNED - DO NOT EDIT. Ships in the framework and is REPLACED on every
;  update (composer update / Module Manager) -- any edit here is SILENTLY LOST.
;  Customize by OVERRIDING in an APP-OWNED tier (merges on top, later wins, and
;  survives updates): application/configs/application.ini * local.ini (secrets) *
;  the `config` DB table (runtime, no deploy).  ACL rules: your OWN module's
;  acl.ini or the acl_* DB tables.  See ARCHITECTURE.md Sec 0 + Sec 5 (cascade).
; ==============================================================================

; Newsletter module ACL — TIGER-OWNED (first-party module).
;
; PRIVILEGE-SCOPED, not a blanket service grant (mirrors the comment module, TIGER-142).
; Subscribe / confirm / unsubscribe are public acts, so guests get exactly those privileges —
; the admin method (datatable) and the audience service (segments/members) are granted only to
; admin+. This governs DISCOVERY as well as dispatch: the /api catalog + MCP tools/list reflect the
; methods a role is ALLOWED, so a blanket guest allow would advertise the admin ops to anonymous
; callers. Execution is also re-checked in-service by _isAtLeastAdmin() (defense-in-depth).
[production]

acl.resources.newsletter_subscribe_svc.resource = "Newsletter_Service_Subscribe"
acl.resources.newsletter_audience_svc.resource  = "Newsletter_Service_Audience"
acl.resources.newsletter_admin_ctrl.resource     = "Newsletter_AdminController"
acl.resources.newsletter_index_ctrl.resource      = "Newsletter_IndexController"

; Public (guest+): subscribe, confirm a subscription, unsubscribe.
acl.rules.newsletter_subscribe.role       = "guest"
acl.rules.newsletter_subscribe.resource   = "Newsletter_Service_Subscribe"
acl.rules.newsletter_subscribe.privilege  = "subscribe"
acl.rules.newsletter_subscribe.permission = "allow"
acl.rules.newsletter_confirm.role       = "guest"
acl.rules.newsletter_confirm.resource   = "Newsletter_Service_Subscribe"
acl.rules.newsletter_confirm.privilege  = "confirm"
acl.rules.newsletter_confirm.permission = "allow"
acl.rules.newsletter_unsubscribe.role       = "guest"
acl.rules.newsletter_unsubscribe.resource   = "Newsletter_Service_Subscribe"
acl.rules.newsletter_unsubscribe.privilege  = "unsubscribe"
acl.rules.newsletter_unsubscribe.permission = "allow"

; Public front-end pages (the confirm / unsubscribe landing pages the emailed links open).
acl.rules.newsletter_index_ctrl.role       = "guest"
acl.rules.newsletter_index_ctrl.resource   = "Newsletter_IndexController"
acl.rules.newsletter_index_ctrl.permission = "allow"

; Admin-only: the subscriber grid's data (also re-checked in-service by _isAtLeastAdmin()).
acl.rules.newsletter_datatable.role       = "admin"
acl.rules.newsletter_datatable.resource   = "Newsletter_Service_Subscribe"
acl.rules.newsletter_datatable.privilege  = "datatable"
acl.rules.newsletter_datatable.permission = "allow"

; Admin-only: the audience segment provider's /api surface.
acl.rules.newsletter_audience.role       = "admin"
acl.rules.newsletter_audience.resource   = "Newsletter_Service_Audience"
acl.rules.newsletter_audience.permission = "allow"

; The subscriber list screen.
acl.rules.newsletter_admin_ctrl.role       = "admin"
acl.rules.newsletter_admin_ctrl.resource   = "Newsletter_AdminController"
acl.rules.newsletter_admin_ctrl.permission = "allow"

[staging : production]
[testing : production]
[development : production]
