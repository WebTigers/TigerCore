;
; TigerGit — top-level admin sidebar item. Discovered by Tiger_Admin_Nav (globs each active module's
; configs/navigation.ini, like acl.ini). Gated only by the ACL resource, so it shows for any role
; allowed Git_AdminController (admin+) and hides otherwise.
nav.git.label    = "git.nav.label"
nav.git.icon     = "fa-code-branch"
nav.git.href     = "/git/admin"
nav.git.match    = "/git/admin"
nav.git.resource = "Git_AdminController"
nav.git.order    = 45
