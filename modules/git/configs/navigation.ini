;
; TigerGit — top-level admin sidebar item. Discovered by Tiger_Admin_Nav (globs each active module's
; configs/navigation.ini, like acl.ini). Gated by the ACL resource (a role allowed Git_AdminController,
; admin+) AND by org: git is install-level (TIGER-511), so `install_only` hides it from every org but the
; install's own.
nav.git.label    = "git.nav.label"
nav.git.icon     = "fa-code-branch"
nav.git.href     = "/git/admin"
nav.git.match    = "/git/admin"
nav.git.resource = "Git_AdminController"
nav.git.order    = 45
nav.git.install_only = 1
