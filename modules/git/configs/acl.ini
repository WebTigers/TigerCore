;
; Tiger_Git module ACL (TIGER-334). Phase 1 ships substrate only — no /api services or controllers
; yet, so there are no rules to declare. The authorization SHAPE is fixed here as the contract Phase 2
; builds to (deny-by-default, per-privilege, no blanket grant, TIGER-335):
;
;   - Each service method is its own privilege (never a blanket resource-level grant). The repo/release
;     services are admin+ (they drive a connected GitHub repo).
;   - The sharp, owner-only operations — creating a semver TAG and SUBMITTING a release to QA — are a
;     CAPABILITY resource, Tiger_Git::RESOURCE_RELEASE ("Tiger_Git_Release"), named for the capability
;     not a role tier, checked with _isAllowed('tag'|'submit', Tiger_Git::RESOURCE_RELEASE). The service
;     is reachable by an editor/admin; only the module owner holds the release privileges.
;
; Example (Phase 2, when Git_Service_Repo + Git_Service_Release exist):
;
; acl.resources.git_repo_svc.resource    = "Git_Service_Repo"
; acl.rules.git_repo_connect.role        = "admin"
; acl.rules.git_repo_connect.resource    = "Git_Service_Repo"
; acl.rules.git_repo_connect.privilege   = "connect"
; acl.rules.git_repo_connect.permission  = "allow"
;
; acl.resources.git_release_cap.resource = "Tiger_Git_Release"
; acl.rules.git_release_tag.role         = "owner"
; acl.rules.git_release_tag.resource     = "Tiger_Git_Release"
; acl.rules.git_release_tag.privilege    = "tag"
; acl.rules.git_release_tag.permission   = "allow"
