; ==============================================================================
;  TIGER-OWNED - DO NOT EDIT. Ships in the framework and is REPLACED on every
;  update (composer update / Module Manager) -- any edit here is SILENTLY LOST.
;  Customize by OVERRIDING in an APP-OWNED tier (merges on top, later wins, and
;  survives updates): application/configs/application.ini * local.ini (secrets) *
;  the `config` DB table (runtime, no deploy).  ACL rules: your OWN module's
;  acl.ini or the acl_* DB tables.  See ARCHITECTURE.md Sec 0 + Sec 5 (cascade).
; ==============================================================================

; Tiger_Git module ACL (TIGER-334 / TIGER-367). Deny-by-default, one rule PER PRIVILEGE (never a
; blanket resource-level grant — the F5 anti-pattern, TIGER-335). The repo/release services drive a
; connected GitHub repo, so they are admin+.
;
; The two SHARP, owner-only operations — creating a semver TAG and SUBMITTING a release to QA — are a
; CAPABILITY resource, Tiger_Git::RESOURCE_RELEASE ("Tiger_Git_Release"), named for the capability not
; a role tier, checked in-method with _isAllowed('tag'|'submit', Tiger_Git::RESOURCE_RELEASE). The
; service is reachable by an admin (so the call dispatches), but the capability is granted only to
; SUPERADMIN, so an ordinary admin who can read releases still cannot cut one. A deployment with its own
; "owner" role grants the capability to it in an app-owned acl tier — the rule is data, not code.
[production]

acl.resources.git_admin_ctrl.resource  = "Git_AdminController"
acl.resources.git_repo_svc.resource    = "Git_Service_Repo"
acl.resources.git_release_svc.resource = "Git_Service_Release"
acl.resources.git_update_svc.resource  = "Git_Service_Update"
; A capability resource (not a service): the data-driven "may this role cut a release" answer.
acl.resources.git_release_cap.resource = "Tiger_Git_Release"

; --- the admin screen (admin) ----------------------------------------------------------------
acl.rules.git_admin_ctrl.role       = "admin"
acl.rules.git_admin_ctrl.resource   = "Git_AdminController"
acl.rules.git_admin_ctrl.permission = "allow"

; --- Git_Service_Repo (admin) — one rule per public method -----------------------------------
acl.rules.git_repo_connect.role          = "admin"
acl.rules.git_repo_connect.resource      = "Git_Service_Repo"
acl.rules.git_repo_connect.privilege     = "connect"
acl.rules.git_repo_connect.permission    = "allow"
acl.rules.git_repo_status.role           = "admin"
acl.rules.git_repo_status.resource       = "Git_Service_Repo"
acl.rules.git_repo_status.privilege      = "status"
acl.rules.git_repo_status.permission     = "allow"
acl.rules.git_repo_recheck.role          = "admin"
acl.rules.git_repo_recheck.resource      = "Git_Service_Repo"
acl.rules.git_repo_recheck.privilege     = "recheck"
acl.rules.git_repo_recheck.permission    = "allow"
acl.rules.git_repo_list.role             = "admin"
acl.rules.git_repo_list.resource         = "Git_Service_Repo"
acl.rules.git_repo_list.privilege        = "list"
acl.rules.git_repo_list.permission       = "allow"
acl.rules.git_repo_log.role              = "admin"
acl.rules.git_repo_log.resource          = "Git_Service_Repo"
acl.rules.git_repo_log.privilege         = "log"
acl.rules.git_repo_log.permission        = "allow"
acl.rules.git_repo_disconnect.role       = "admin"
acl.rules.git_repo_disconnect.resource   = "Git_Service_Repo"
acl.rules.git_repo_disconnect.privilege  = "disconnect"
acl.rules.git_repo_disconnect.permission = "allow"

; --- Git_Service_Release (admin reaches the service; tag/submit narrowed by the capability) --
acl.rules.git_release_tag.role           = "admin"
acl.rules.git_release_tag.resource       = "Git_Service_Release"
acl.rules.git_release_tag.privilege      = "tag"
acl.rules.git_release_tag.permission     = "allow"
acl.rules.git_release_submit.role        = "admin"
acl.rules.git_release_submit.resource    = "Git_Service_Release"
acl.rules.git_release_submit.privilege   = "submit"
acl.rules.git_release_submit.permission  = "allow"
acl.rules.git_release_decide.role        = "admin"
acl.rules.git_release_decide.resource    = "Git_Service_Release"
acl.rules.git_release_decide.privilege   = "decide"
acl.rules.git_release_decide.permission  = "allow"
acl.rules.git_release_list.role          = "admin"
acl.rules.git_release_list.resource      = "Git_Service_Release"
acl.rules.git_release_list.privilege     = "list"
acl.rules.git_release_list.permission    = "allow"

; --- Git_Service_Update (admin) — receive approved updates ----------------------------------
acl.rules.git_update_check.role          = "admin"
acl.rules.git_update_check.resource      = "Git_Service_Update"
acl.rules.git_update_check.privilege     = "check"
acl.rules.git_update_check.permission    = "allow"
acl.rules.git_update_apply.role          = "admin"
acl.rules.git_update_apply.resource      = "Git_Service_Update"
acl.rules.git_update_apply.privilege     = "apply"
acl.rules.git_update_apply.permission    = "allow"
acl.rules.git_update_setpolicy.role      = "admin"
acl.rules.git_update_setpolicy.resource  = "Git_Service_Update"
acl.rules.git_update_setpolicy.privilege = "setPolicy"
acl.rules.git_update_setpolicy.permission= "allow"
acl.rules.git_update_rollback.role       = "admin"
acl.rules.git_update_rollback.resource   = "Git_Service_Update"
acl.rules.git_update_rollback.privilege  = "rollback"
acl.rules.git_update_rollback.permission = "allow"

; --- the release CAPABILITY — superadmin only (stricter than the admin-level service) --------
acl.rules.git_release_cap_tag.role        = "superadmin"
acl.rules.git_release_cap_tag.resource    = "Tiger_Git_Release"
acl.rules.git_release_cap_tag.privilege   = "tag"
acl.rules.git_release_cap_tag.permission  = "allow"
acl.rules.git_release_cap_submit.role       = "superadmin"
acl.rules.git_release_cap_submit.resource   = "Tiger_Git_Release"
acl.rules.git_release_cap_submit.privilege  = "submit"
acl.rules.git_release_cap_submit.permission = "allow"

[staging : production]
[testing : production]
[development : production]
