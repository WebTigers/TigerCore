;
; Email Templates module ACL — the authoring screen + its /api service, admin+ only. The deny-by-default
; spine in core acl.ini governs everyone else (guest/user/manager see nothing here). Resource names
; follow the framework convention: a controller resolves to "<Module>_<Controller>Controller", a service
; to "<Module>_Service_<Name>".
[production]

acl.resources.email_admin_ctrl.resource    = "Email_AdminController"
acl.resources.email_template_svc.resource  = "Email_Service_Template"

acl.rules.email_admin_ctrl.role       = "admin"
acl.rules.email_admin_ctrl.resource   = "Email_AdminController"
acl.rules.email_admin_ctrl.permission = "allow"

acl.rules.email_template_svc.role       = "admin"
acl.rules.email_template_svc.resource   = "Email_Service_Template"
acl.rules.email_template_svc.permission = "allow"

[staging : production]

[testing : production]

[development : production]
