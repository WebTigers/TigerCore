;
; The domain-verification well-known path (folds into the config cascade — ARCHITECTURE.md §6).
; /.well-known/tiger-verify.txt -> Register_VerifyController::domainAction.
[production]
resources.router.routes.tigerVerify.type                = "Zend_Controller_Router_Route_Static"
resources.router.routes.tigerVerify.route               = ".well-known/tiger-verify.txt"
resources.router.routes.tigerVerify.defaults.module     = "register"
resources.router.routes.tigerVerify.defaults.controller = "verify"
resources.router.routes.tigerVerify.defaults.action     = "domain"
[staging : production]
[testing : production]
[development : production]
