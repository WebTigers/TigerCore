;
; Register ACL. The Registration screen + its service are ADMIN. The Verify controller is GUEST — it serves
; the public domain token (/.well-known/tiger-verify.txt) and the admin email magic link (token, not session).
[production]
acl.resources.register_admin_ctrl.resource   = "Register_AdminController"
acl.resources.register_verify_ctrl.resource   = "Register_VerifyController"
acl.resources.register_registration_svc.resource = "Register_Service_Registration"

acl.rules.register_admin_ctrl.role       = "admin"
acl.rules.register_admin_ctrl.resource   = "Register_AdminController"
acl.rules.register_admin_ctrl.permission = "allow"

acl.rules.register_registration_svc.role       = "admin"
acl.rules.register_registration_svc.resource   = "Register_Service_Registration"
acl.rules.register_registration_svc.permission = "allow"

acl.rules.register_verify_ctrl.role       = "guest"
acl.rules.register_verify_ctrl.resource   = "Register_VerifyController"
acl.rules.register_verify_ctrl.permission = "allow"
[staging : production]
[testing : production]
[development : production]
