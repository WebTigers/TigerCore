; ==============================================================================
;  TIGER-OWNED - DO NOT EDIT. Ships in the framework and is REPLACED on every
;  update (composer update / Module Manager) -- any edit here is SILENTLY LOST.
;  Customize by OVERRIDING in an APP-OWNED tier (merges on top, later wins, and
;  survives updates): application/configs/application.ini * local.ini (secrets) *
;  the `config` DB table (runtime, no deploy).  ACL rules: your OWN module's
;  acl.ini or the acl_* DB tables.  See ARCHITECTURE.md Sec 0 + Sec 5 (cascade).
; ==============================================================================

; Comments module ACL — TIGER-OWNED (first-party module).
;
; PRIVILEGE-SCOPED, not a blanket service grant (TIGER-142). Reading + posting are public
; acts, so guests get `list`/`post` — but the admin methods (moderate/datatable) and the
; owner methods (edit/delete) are named PRIVILEGES granted to the right floor, not to guest.
; This matters for DISCOVERY as much as dispatch: the /api catalog + MCP `tools/list` reflect
; exactly the methods a role is ALLOWED, so a blanket guest allow advertised the admin ops
; (comment__comment__{moderate,datatable,delete}) to anonymous callers. Execution was already
; gated in-service by _isAtLeastAdmin()/ownership (defense-in-depth) — this stops ADVERTISING
; them. Every call still re-checks the SUBJECT's own ACL resource, so a thread never exposes
; content the caller can't see.
[production]

acl.resources.comment_svc.resource        = "Comment_Service_Comment"
acl.resources.comment_admin_ctrl.resource = "Comment_AdminController"
acl.resources.comment_settings_svc.resource = "Comment_Service_Settings"

; Public (guest+): read a thread, post a comment or a rating.
acl.rules.comment_list.role       = "guest"
acl.rules.comment_list.resource   = "Comment_Service_Comment"
acl.rules.comment_list.privilege  = "list"
acl.rules.comment_list.permission = "allow"
acl.rules.comment_post.role       = "guest"
acl.rules.comment_post.resource   = "Comment_Service_Comment"
acl.rules.comment_post.privilege  = "post"
acl.rules.comment_post.permission = "allow"

; Signed-in users (user+): manage their OWN comment (the service re-checks ownership + edit window).
acl.rules.comment_edit.role       = "user"
acl.rules.comment_edit.resource   = "Comment_Service_Comment"
acl.rules.comment_edit.privilege  = "edit"
acl.rules.comment_edit.permission = "allow"
acl.rules.comment_delete.role       = "user"
acl.rules.comment_delete.resource   = "Comment_Service_Comment"
acl.rules.comment_delete.privilege  = "delete"
acl.rules.comment_delete.permission = "allow"

; Admin-only: the moderation queue's data + actions (also enforced in-service by _isAtLeastAdmin()).
acl.rules.comment_moderate.role       = "admin"
acl.rules.comment_moderate.resource   = "Comment_Service_Comment"
acl.rules.comment_moderate.privilege  = "moderate"
acl.rules.comment_moderate.permission = "allow"
acl.rules.comment_datatable.role       = "admin"
acl.rules.comment_datatable.resource   = "Comment_Service_Comment"
acl.rules.comment_datatable.privilege  = "datatable"
acl.rules.comment_datatable.permission = "allow"

; The moderation queue.
acl.rules.comment_admin_ctrl.role       = "admin"
acl.rules.comment_admin_ctrl.resource   = "Comment_AdminController"
acl.rules.comment_admin_ctrl.permission = "allow"

; Module settings (the AI spam toggle) — admin+.
acl.rules.comment_settings_svc.role       = "admin"
acl.rules.comment_settings_svc.resource   = "Comment_Service_Settings"
acl.rules.comment_settings_svc.permission = "allow"

[staging : production]
[testing : production]
[development : production]
