;
; The profile module surfaces the signed-in user's self-service screens into the "My Account" menu
; (Tiger_Account_Nav) — the zero-code, config-only way a module contributes an account screen. Each
; item is ACL-gated by its `resource`, so "Profile" shows for any user and "My Organization" (an
; admin editing the org they're in) shows only for admins. This is the reference example: drop a
; navigation-account.ini in your module to park a user screen in the account sidebar.

nav.profile.label    = "Profile"
nav.profile.icon     = "fa-user"
nav.profile.href     = "/user/profile"
nav.profile.match    = "/user/profile"
nav.profile.resource = "Profile_IndexController"
nav.profile.order    = 10

nav.org.label    = "My Organization"
nav.org.icon     = "fa-building-user"
nav.org.href     = "/profile/org"
nav.org.match    = "/profile/org"
nav.org.resource = "Profile_OrgController"
nav.org.order    = 20
