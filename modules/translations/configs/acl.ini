;
; Translations ACL — deny-by-default. The admin screen + its /api engine are admin+.
; Overriding platform-wide strings is a platform-administration act (like Settings), so it
; sits at admin, matching the CMS/System admin surfaces.
[production]

acl.resources.translations_ctrl.resource = "Translations_IndexController"
acl.resources.translations_svc.resource  = "Translations_Service_Translation"

acl.rules.translations_ctrl.role       = "admin"
acl.rules.translations_ctrl.resource   = "Translations_IndexController"
acl.rules.translations_ctrl.permission = "allow"

acl.rules.translations_svc.role       = "admin"
acl.rules.translations_svc.resource   = "Translations_Service_Translation"
acl.rules.translations_svc.permission = "allow"

[staging : production]

[testing : production]

[development : production]
