; Messages module ACL — TIGER-OWNED (first-party module).
;
; The inbox is a signed-in USER surface: every member has one. Both the screen and the service are
; allowed at `user`; the service then enforces the finer rules itself — org scoping, who may compose
; (admins always; others only when person-to-person is enabled), and who may be blocked.
[production]

acl.resources.message_index_ctrl.resource = "Message_IndexController"
acl.resources.message_svc.resource        = "Message_Service_Message"

acl.rules.message_index_ctrl.role       = "user"
acl.rules.message_index_ctrl.resource   = "Message_IndexController"
acl.rules.message_index_ctrl.permission = "allow"

acl.rules.message_svc.role       = "user"
acl.rules.message_svc.resource   = "Message_Service_Message"
acl.rules.message_svc.permission = "allow"

[staging : production]
[testing : production]
[development : production]
