; ==============================================================================
;  TIGER-OWNED - DO NOT EDIT. Ships in the framework and is REPLACED on every
;  update (composer update / Module Manager) -- any edit here is SILENTLY LOST.
;  Customize by OVERRIDING in an APP-OWNED tier (merges on top, later wins, and
;  survives updates): application/configs/application.ini * local.ini (secrets) *
;  the `config` DB table (runtime, no deploy).  ACL rules: your OWN module's
;  acl.ini or the acl_* DB tables.  See ARCHITECTURE.md Sec 0 + Sec 5 (cascade).
; ==============================================================================

; Messages module ACL — TIGER-OWNED (first-party module). Reference conversion for TIGER-335.
;
; The inbox is a signed-in USER surface: every member has one. The service's methods are granted
; PER PRIVILEGE (enumerated, never a blanket resource-level allow) so a new method can't silently
; inherit access — the F5 anti-pattern. The finer runtime rules (org scoping, blocks) stay in the
; service. "Who may compose / who is admin-class" is a CAPABILITY — a privilege on the
; Tiger_Message_Compose resource below, granted to `admin` — never a role-string compare in code.
[production]

acl.resources.message_index_ctrl.resource = "Message_IndexController"
acl.resources.message_svc.resource        = "Message_Service_Message"
; A capability resource (not a service): the data-driven "is this role admin-class for messaging"
; answer that Tiger_Message::maySend()/_adminIdsOf()/block() consult. Named for the CAPABILITY, not a
; role tier (TIGER-335). Granted to `admin`, so every role inheriting admin holds it, rename-safe.
acl.resources.message_compose.resource    = "Tiger_Message_Compose"

; The inbox screen — a uniform user surface (every action is user-level; compose self-redirects).
acl.rules.message_index_ctrl.role       = "user"
acl.rules.message_index_ctrl.resource   = "Message_IndexController"
acl.rules.message_index_ctrl.permission = "allow"

; The service — one rule PER PUBLIC METHOD, all at `user`. `send` is allowed here too (so the
; dispatcher lets the call reach the method); the method's own maySend() then applies the capability
; + the user-to-user flag. Adding a method REQUIRES adding its rule — intentionally, so access is
; never granted by omission.
acl.rules.message_svc_list.role         = "user"
acl.rules.message_svc_list.resource     = "Message_Service_Message"
acl.rules.message_svc_list.privilege    = "list"
acl.rules.message_svc_list.permission   = "allow"
acl.rules.message_svc_recent.role       = "user"
acl.rules.message_svc_recent.resource   = "Message_Service_Message"
acl.rules.message_svc_recent.privilege  = "recent"
acl.rules.message_svc_recent.permission = "allow"
acl.rules.message_svc_unread.role       = "user"
acl.rules.message_svc_unread.resource   = "Message_Service_Message"
acl.rules.message_svc_unread.privilege  = "unreadCount"
acl.rules.message_svc_unread.permission = "allow"
acl.rules.message_svc_get.role          = "user"
acl.rules.message_svc_get.resource      = "Message_Service_Message"
acl.rules.message_svc_get.privilege     = "get"
acl.rules.message_svc_get.permission    = "allow"
acl.rules.message_svc_recipients.role       = "user"
acl.rules.message_svc_recipients.resource   = "Message_Service_Message"
acl.rules.message_svc_recipients.privilege  = "recipients"
acl.rules.message_svc_recipients.permission = "allow"
acl.rules.message_svc_markread.role       = "user"
acl.rules.message_svc_markread.resource   = "Message_Service_Message"
acl.rules.message_svc_markread.privilege  = "markRead"
acl.rules.message_svc_markread.permission = "allow"
acl.rules.message_svc_markunread.role       = "user"
acl.rules.message_svc_markunread.resource   = "Message_Service_Message"
acl.rules.message_svc_markunread.privilege  = "markUnread"
acl.rules.message_svc_markunread.permission = "allow"
acl.rules.message_svc_archive.role       = "user"
acl.rules.message_svc_archive.resource   = "Message_Service_Message"
acl.rules.message_svc_archive.privilege  = "archive"
acl.rules.message_svc_archive.permission = "allow"
acl.rules.message_svc_unarchive.role       = "user"
acl.rules.message_svc_unarchive.resource   = "Message_Service_Message"
acl.rules.message_svc_unarchive.privilege  = "unarchive"
acl.rules.message_svc_unarchive.permission = "allow"
acl.rules.message_svc_delete.role       = "user"
acl.rules.message_svc_delete.resource   = "Message_Service_Message"
acl.rules.message_svc_delete.privilege  = "delete"
acl.rules.message_svc_delete.permission = "allow"
acl.rules.message_svc_block.role       = "user"
acl.rules.message_svc_block.resource   = "Message_Service_Message"
acl.rules.message_svc_block.privilege  = "block"
acl.rules.message_svc_block.permission = "allow"
acl.rules.message_svc_unblock.role       = "user"
acl.rules.message_svc_unblock.resource   = "Message_Service_Message"
acl.rules.message_svc_unblock.privilege  = "unblock"
acl.rules.message_svc_unblock.permission = "allow"
acl.rules.message_svc_blocked.role       = "user"
acl.rules.message_svc_blocked.resource   = "Message_Service_Message"
acl.rules.message_svc_blocked.privilege  = "blocked"
acl.rules.message_svc_blocked.permission = "allow"
acl.rules.message_svc_send.role       = "user"
acl.rules.message_svc_send.resource   = "Message_Service_Message"
acl.rules.message_svc_send.privilege  = "send"
acl.rules.message_svc_send.permission = "allow"

; The compose capability — admin-class only. Inheritance carries it upward (superadmin, developer),
; so a site that renames or adds an admin-class role needs no change here.
acl.rules.message_compose.role       = "admin"
acl.rules.message_compose.resource   = "Tiger_Message_Compose"
acl.rules.message_compose.privilege  = "send"
acl.rules.message_compose.permission = "allow"

[staging : production]
[testing : production]
[development : production]
