; Messages routes (TIGER-114). The default router would read /message/compose as controller=compose;
; these pin the short, memorable URLs to IndexController actions. /message itself needs no route
; (module/index/index is the default).
[production]
resources.router.routes.message_compose.route               = "message/compose"
resources.router.routes.message_compose.defaults.module     = "message"
resources.router.routes.message_compose.defaults.controller = "index"
resources.router.routes.message_compose.defaults.action     = "compose"

resources.router.routes.message_reply.route                 = "message/compose/reply/:reply"
resources.router.routes.message_reply.defaults.module       = "message"
resources.router.routes.message_reply.defaults.controller   = "index"
resources.router.routes.message_reply.defaults.action       = "compose"

resources.router.routes.message_blocked.route               = "message/blocked"
resources.router.routes.message_blocked.defaults.module     = "message"
resources.router.routes.message_blocked.defaults.controller = "index"
resources.router.routes.message_blocked.defaults.action     = "blocked"

resources.router.routes.message_view.route                  = "message/view/:view"
resources.router.routes.message_view.defaults.module        = "message"
resources.router.routes.message_view.defaults.controller    = "index"
resources.router.routes.message_view.defaults.action        = "index"

[staging : production]
[testing : production]
[development : production]
