; Matomo ACL — the settings screen + its /api service are admin-only (deny-by-default; without these
; allows the screen and save are refused). Its own resource so access is grantable on its own.
[production]

acl.resources.matomo_admin_ctrl.resource = "Matomo_AdminController"
acl.resources.matomo_svc.resource         = "Matomo_Service_Matomo"

acl.rules.matomo_admin_ctrl.role       = "admin"
acl.rules.matomo_admin_ctrl.resource   = "Matomo_AdminController"
acl.rules.matomo_admin_ctrl.permission = "allow"

acl.rules.matomo_svc.role       = "admin"
acl.rules.matomo_svc.resource   = "Matomo_Service_Matomo"
acl.rules.matomo_svc.permission = "allow"

[staging : production]

[testing : production]

[development : production]
