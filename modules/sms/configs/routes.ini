;
; Inbound SMS webhook — the carrier POSTs to /sms/inbound/<provider> (e.g. /sms/inbound/twilio).
[production]
resources.router.routes.smsInbound.route               = "sms/inbound/:provider"
resources.router.routes.smsInbound.defaults.module     = "sms"
resources.router.routes.smsInbound.defaults.controller = "inbound"
resources.router.routes.smsInbound.defaults.action     = "index"

[staging : production]

[testing : production]

[development : production]
