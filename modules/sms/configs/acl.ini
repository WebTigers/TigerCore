;
; SMS admin ACL — the settings screen + its /api service, admin+ only (deny-by-default elsewhere).
[production]

acl.resources.sms_admin_ctrl.resource   = "Sms_AdminController"
acl.resources.sms_settings_svc.resource = "Sms_Service_Settings"

acl.rules.sms_admin_ctrl.role       = "admin"
acl.rules.sms_admin_ctrl.resource   = "Sms_AdminController"
acl.rules.sms_admin_ctrl.permission = "allow"

acl.rules.sms_settings_svc.role       = "admin"
acl.rules.sms_settings_svc.resource   = "Sms_Service_Settings"
acl.rules.sms_settings_svc.permission = "allow"

[staging : production]

[testing : production]

[development : production]
